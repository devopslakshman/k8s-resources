
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0f7ff272526b361a7
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs
  namespace: roboshop
spec:
  storageClassName: ""
  volumeName: ebs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
