
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: default
  labels:
    tier: frontend
    project: roboshop
    environment: dev

spec:
  type: LoadBalancer

  selector:
    tier: frontend
    project: roboshop
    environment: dev

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
