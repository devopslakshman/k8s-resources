apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: default
  labels:
    app: nginx
    project: roboshop
spec:
  nodeSelector:
    project: roboshop

  tolerations:
    - key: "project"
      operator: "Equal"
      value: "roboshop"
      effect: "NoSchedule"

  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
