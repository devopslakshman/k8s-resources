
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
  labels:
    tier: frontend
    project: roboshop
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: frontend
      project: roboshop
      environment: dev
  template:
    metadata:
      labels:
        tier: frontend
        project: roboshop
        environment: dev
      annotations:
        kubernetes.io/change-cause: "Updated nginx image to nginx:1.2.0"
    spec:
      containers:
        - name: nginx
          image: nginx:1.2.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
 